name: Release Build

on:
  workflow_dispatch:

jobs:
  # Avoid running frontend typechecks for every target platform
  frontend-checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run check

  tauri-build:
    needs: frontend-checks

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: nsis
            ext: .exe
          - os: macos-latest
            target: dmg
            ext: .dmg
          - os: ubuntu-latest
            target: appimage
            ext: .AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Configure cross-platform Rust targets
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@action-1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --bundles ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quilum-${{ matrix.os }}-${{ matrix.ext }}
          path: src-tauri/target/release/bundle/*/*${{ matrix.ext }}
